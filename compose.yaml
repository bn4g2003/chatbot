services:
  postgres:
    image: postgres:17-alpine
    container_name: lorelia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lorelia
      POSTGRES_USER: lorelia
      POSTGRES_PASSWORD: lorelia_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lorelia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorelia -d lorelia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lorelia_postgres_data:
